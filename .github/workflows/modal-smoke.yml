name: Modal smoke

# Proves the Modal bundle generated by `@tuttiai/deploy` still deploys cleanly
# against Modal's free tier. Runs nightly, on push to main, and on demand.
# Pull requests that touch `packages/deploy/src/targets/modal.ts` get the
# `deploy-smoke` label applied by `.github/workflows/deploy-smoke-label.yml`,
# which retriggers this workflow on the same PR.
#
# Forks: secrets are unavailable on `pull_request` events from forks, so the
# job's `if:` gate short-circuits before any Modal call. PRs from forks
# therefore never break here.

on:
  push:
    branches: [main]
  schedule:
    # 06:00 UTC every day — picks up overnight Modal CLI / image regressions.
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: read

# A second push while a deploy is in flight would race the
# `modal app stop tutti-smoke` step. Cancel the older run.
concurrency:
  group: modal-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hard gate: PR runs only fire when the `deploy-smoke` label is present.
    # Non-PR triggers (push / schedule / workflow_dispatch) always run.
    # Secret-presence is checked in the first step (can't reference `secrets`
    # in a job-level `if:` directly).
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-smoke')

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APP_NAME: tutti-smoke
      SCORE_PATH: examples/marketing-agent/tutti.score.ts
      BUNDLE_DIR: .tutti/modal-smoke

    steps:
      - name: Check required secrets
        id: gate
        # Skip the whole run cleanly (success, no work done) when running
        # without secrets. This is the fork-PR case AND the case where the
        # workflow is enabled on a repo that hasn't provisioned Modal creds
        # yet. Setting an output lets every later step gate on it.
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Modal smoke — MODAL_TOKEN_ID / MODAL_TOKEN_SECRET / ANTHROPIC_API_KEY not set."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Install Modal CLI
        if: steps.gate.outputs.ready == 'true'
        run: pip install --quiet modal

      - name: Install npm deps + build workspace
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Provision Modal secret (tutti-anthropic-api-key)
        if: steps.gate.outputs.ready == 'true'
        # The generated `modal_app.py` references
        # `modal.Secret.from_name('tutti-anthropic-api-key')`, so the secret
        # must exist in Modal before `modal deploy` runs. `--force` makes the
        # step idempotent across nightly runs.
        run: |
          modal secret create tutti-anthropic-api-key \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --force

      - name: Generate Modal bundle from marketing-agent score
        if: steps.gate.outputs.ready == 'true'
        # The deploy block on the marketing agent pins `name: "tutti-smoke"`
        # so the resulting `modal_app.py` declares `app = modal.App('tutti-smoke')`
        # and the later `modal app stop tutti-smoke` matches.
        run: |
          node --input-type=module -e '
            import { buildDeployManifest, generateModalBundle } from "@tuttiai/deploy";
            const score = process.env.SCORE_PATH;
            const out = process.env.BUNDLE_DIR;
            const m = await buildDeployManifest(score);
            if (m.name !== "tutti-smoke") {
              throw new Error("Expected manifest name tutti-smoke, got " + m.name);
            }
            await generateModalBundle(m, score, out);
          '
          ls -la "$BUNDLE_DIR"

      - name: Deploy to Modal
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ env.BUNDLE_DIR }}
        run: modal deploy modal_app.py

      - name: Resolve deployed web URL
        if: steps.gate.outputs.ready == 'true'
        id: url
        # `modal.Function.from_name(app, fn).get_web_url()` is the documented
        # SDK accessor for `@modal.web_server` URLs. Older Modal versions
        # exposed it as a `.web_url` attribute; the fallback keeps the smoke
        # working across SDK upgrades. If both are gone, the step fails loudly
        # — preferable to scraping `modal deploy` stdout, which has no
        # stability contract.
        run: |
          URL=$(python - <<'PY'
          import modal
          fn = modal.Function.from_name("tutti-smoke", "serve")
          try:
              url = fn.get_web_url()
          except AttributeError:
              url = fn.web_url
          print(url)
          PY
          )
          if [ -z "$URL" ]; then
            echo "::error::Failed to resolve web URL for tutti-smoke/serve"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed at: $URL"

      - name: Poll /health until 200
        if: steps.gate.outputs.ready == 'true'
        # Cold-starting `node:20-bookworm-slim` + `npm i -g tutti-ai` inside
        # Modal can take well over 30s on a free-tier worker, so a blind
        # `sleep 30 && curl` would flake. Poll for up to 4 minutes (the Modal
        # function's own startup_timeout is 120s, but the cold-start container
        # pull also counts against us on the first request).
        run: |
          URL='${{ steps.url.outputs.url }}'
          DEADLINE=$(( $(date +%s) + 240 ))
          ATTEMPT=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            STATUS=$(curl -sS -o /tmp/health.out -w '%{http_code}' "${URL%/}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "OK on attempt ${ATTEMPT} after $(( $(date +%s) - (DEADLINE - 240) ))s"
              cat /tmp/health.out
              exit 0
            fi
            echo "Attempt ${ATTEMPT}: status=${STATUS}"
            sleep 5
          done
          echo "::error::Smoke endpoint never returned 200 within 240s"
          cat /tmp/health.out || true
          exit 1

      - name: Stop the deployed app
        # Run on success AND failure so we never leak a running Modal app
        # into the next nightly window — but only when we actually deployed.
        # `always()` must lead so GitHub re-enables the step after upstream
        # failure; otherwise the default skip-on-failure short-circuits the
        # `&&`.
        if: always() && steps.gate.outputs.ready == 'true'
        run: modal app stop tutti-smoke || true
